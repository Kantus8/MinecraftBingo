# =====================================================================
#  Minecraft Bingo — propriétés de build
#  Toutes les versions du projet sont centralisées ici.
#  Ne pas éditer build.gradle pour changer une version : c'est ici.
# =====================================================================

# --- Gradle / JVM ---------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# --- Minecraft / Fabric ---------------------------------------------
# Docs : https://fabricmc.net/develop
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.16.14

# Version minimale de Loader exigée à l'exécution (fabric.mod.json)
loader_version_range=>=0.15.0

# Java : 1.20.1 tourne sur Java 17
java_version=17

# --- Métadonnées du mod ---------------------------------------------
mod_version=0.1.0
maven_group=com.bingo
archives_base_name=bingo
mod_id=bingo
mod_name=Minecraft Bingo

# --- Dépendances ----------------------------------------------------
# Fabric API — https://modrinth.com/mod/fabric-api/versions?g=1.20.1
fabric_version=0.92.9+1.20.1

# Simple Voice Chat API — https://maven.maxhenkel.de/#/releases/de/maxhenkel/voicechat/voicechat-api
# NB : l'artefact "voicechat-api" est versionné indépendamment de Minecraft.
#      2.5.x correspond à la ligne du mod "voicechat-fabric-1.20.1-2.5.x".
voicechat_api_version=2.5.36
# Version du mod complet, utilisée pour le runtime local et la contrainte fabric.mod.json
voicechat_mod_version=2.5.36
# ⚠️ Le mod distribué s'annonce "1.20.1-2.5.36" : Max Henkel préfixe ses versions par
#    celle de Minecraft. En semver, "1.20.1-2.5.36" = version 1.20.1 + pre-release
#    "2.5.36", et une pre-release est INFÉRIEURE à sa release. Une contrainte ">=2.5.0"
#    ne matche donc JAMAIS, quelle que soit la version installée : Loader refuse de
#    démarrer avec "only the wrong version is present". Le plancher doit être écrit
#    dans la même forme préfixée. Cohérent avec "minecraft": "~1.20.1".
voicechat_version_range=>=1.20.1-2.5.0

# JEI — https://maven.blamejared.com/mezz/jei/
jei_version=15.21.0.148
jei_version_range=>=15.20.0.0
